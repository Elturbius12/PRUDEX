name: asistente_pl
description: Asistente de Decisiones para Emprendedores — Programación Lineal con IA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  http: ^1.3.0
  audioplayers: ^6.1.0
  file_picker: ^10.3.10
  excel: ^4.0.6
  csv: ^6.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/vosk/